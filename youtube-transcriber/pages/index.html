<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Transcriber</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161a22;
            --panel-2: #1e2330;
            --border: #2a3142;
            --fg: #e6e8ec;
            --muted: #8b94a7;
            --accent: #ff5252;
            --accent-2: #ff7676;
            --ok: #7cf0a0;
            --warn: #f0bd7c;
            --err: #f5b3b3;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .sub { color: var(--muted); margin-bottom: 28px; }
        form, .card { background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; }
        .card + .card, form + .card, .card + form { margin-top: 16px; }
        label { display: block; font-size: 13px; color: var(--muted);
            margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; background: var(--panel-2);
            color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px;
        }
        textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            min-height: 320px; resize: vertical; line-height: 1.5; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-top: 14px; }
        .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; }
        button { background: var(--accent); color: white; border: 0;
            padding: 10px 18px; border-radius: 8px; font-weight: 600;
            cursor: pointer; font-size: 14px; }
        button.ghost { background: transparent; color: var(--fg);
            border: 1px solid var(--border); }
        button:hover { background: var(--accent-2); }
        button.ghost:hover { background: var(--panel-2); }
        button:disabled { background: #444; cursor: not-allowed; }
        .status { color: var(--muted); font-size: 13px; }
        .result { margin-top: 24px; }
        .meta { display: flex; gap: 16px; color: var(--muted);
            font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
        .meta span b { color: var(--fg); font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; }
        .badge.captions { background: #1f3a2a; color: var(--ok); }
        .badge.whisper  { background: #3a2a1f; color: var(--warn); }
        .error { background: #3a1f1f; border: 1px solid #5a2a2a; color: var(--err);
            padding: 12px 14px; border-radius: 8px; margin-top: 18px; }
        .api-banner { display: flex; gap: 10px; align-items: center;
            font-size: 13px; color: var(--muted); margin-bottom: 16px; }
        .api-banner .dot { width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted); }
        .api-banner .dot.ok { background: var(--ok); }
        .api-banner .dot.err { background: var(--err); }
        details { margin-top: 14px; }
        summary { cursor: pointer; color: var(--muted); font-size: 13px; }
        a { color: var(--accent-2); }
        code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px;
            font-size: 12px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>YouTube Transcriber</h1>
    <p class="sub">
        Static frontend hosted on GitHub Pages. Point it at a backend running the
        Flask API to transcribe videos (captions first, Whisper fallback).
    </p>

    <div class="api-banner">
        <span class="dot" id="apiDot"></span>
        <span>Backend: <code id="apiCurrent">—</code></span>
        <button type="button" class="ghost" id="apiEdit" style="margin-left:auto">Change</button>
    </div>

    <div class="card" id="apiCard" hidden>
        <label for="apiUrl">Backend base URL</label>
        <input id="apiUrl" type="url" placeholder="https://your-backend.fly.dev">
        <div class="actions">
            <button type="button" id="apiSave">Save</button>
            <button type="button" class="ghost" id="apiTest">Test connection</button>
            <span class="status" id="apiStatus"></span>
        </div>
    </div>

    <form id="form">
        <label for="url">Video URL or ID</label>
        <input id="url" name="url" type="text"
               placeholder="https://www.youtube.com/watch?v=..." required>

        <details>
            <summary>Advanced options</summary>
            <div class="row">
                <div>
                    <label for="languages">Preferred caption languages</label>
                    <input id="languages" name="languages" type="text"
                           value="en,de" placeholder="en,de">
                </div>
                <div>
                    <label for="whisper_model">Whisper model (fallback)</label>
                    <select id="whisper_model" name="whisper_model">
                        <option value="tiny">tiny</option>
                        <option value="base" selected>base</option>
                        <option value="small">small</option>
                        <option value="medium">medium</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <label>
                    <input type="checkbox" id="allow_whisper" checked>
                    Allow Whisper fallback
                </label>
            </div>
        </details>

        <div class="actions">
            <button id="go" type="submit">Transcribe</button>
            <span class="status" id="status"></span>
        </div>
    </form>

    <div id="error" class="error" hidden></div>

    <div class="result" id="result" hidden>
        <div class="meta">
            <span>Source: <b id="src"></b> <span id="srcBadge" class="badge"></span></span>
            <span>Language: <b id="lang"></b></span>
            <span>Video: <b id="vid"></b></span>
        </div>
        <label for="text">Transcript</label>
        <textarea id="text" readonly></textarea>
        <div class="actions">
            <button id="copy" type="button">Copy</button>
            <button id="download" type="button" class="ghost">Download .txt</button>
        </div>
    </div>
</div>

<script>
const STORAGE_KEY = 'ytt.apiBase';
const DEFAULT_API = ''; // build-time override; see config.js
const $ = (id) => document.getElementById(id);

function getApiBase() {
    const fromQuery = new URLSearchParams(location.search).get('api');
    if (fromQuery) {
        localStorage.setItem(STORAGE_KEY, fromQuery);
        return fromQuery;
    }
    return localStorage.getItem(STORAGE_KEY) || window.YTT_API_BASE || DEFAULT_API;
}
function setApiBase(v) {
    if (v) { localStorage.setItem(STORAGE_KEY, v); }
    else   { localStorage.removeItem(STORAGE_KEY); }
    renderApiBanner();
}
function renderApiBanner() {
    const base = getApiBase();
    $('apiCurrent').textContent = base || '(not configured)';
    $('apiUrl').value = base || '';
    $('apiDot').className = 'dot' + (base ? '' : ' err');
}

$('apiEdit').addEventListener('click', () => { $('apiCard').hidden = !$('apiCard').hidden; });
$('apiSave').addEventListener('click', () => {
    setApiBase($('apiUrl').value.trim().replace(/\/+$/, ''));
    $('apiStatus').textContent = 'Saved.';
    setTimeout(() => $('apiStatus').textContent = '', 1500);
});
$('apiTest').addEventListener('click', async () => {
    const base = $('apiUrl').value.trim().replace(/\/+$/, '');
    if (!base) { $('apiStatus').textContent = 'Enter a URL first.'; return; }
    $('apiStatus').textContent = 'Testing…';
    try {
        const res = await fetch(base + '/api/health');
        if (res.ok) {
            $('apiStatus').textContent = '✓ reachable';
            $('apiDot').className = 'dot ok';
        } else {
            $('apiStatus').textContent = `✗ HTTP ${res.status}`;
            $('apiDot').className = 'dot err';
        }
    } catch (err) {
        $('apiStatus').textContent = '✗ ' + err.message;
        $('apiDot').className = 'dot err';
    }
});

renderApiBanner();

$('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').hidden = true;
    $('result').hidden = true;
    const base = getApiBase();
    if (!base) {
        $('error').textContent = 'No backend configured. Click "Change" above to set one.';
        $('error').hidden = false;
        return;
    }
    $('go').disabled = true;
    $('status').textContent = 'Working… (Whisper fallback can take a minute)';

    const payload = {
        url: $('url').value,
        languages: $('languages').value,
        whisper_model: $('whisper_model').value,
        allow_whisper: $('allow_whisper').checked,
    };

    try {
        const res = await fetch(base + '/api/transcribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            $('error').textContent = data.error || `Request failed (HTTP ${res.status}).`;
            $('error').hidden = false;
            return;
        }
        $('src').textContent = data.source;
        $('srcBadge').textContent = data.source;
        $('srcBadge').className = 'badge ' + data.source;
        $('lang').textContent = data.language || '—';
        $('vid').textContent = data.video_id;
        $('text').value = data.text;
        $('result').hidden = false;
    } catch (err) {
        $('error').textContent = 'Network error: ' + err.message;
        $('error').hidden = false;
    } finally {
        $('go').disabled = false;
        $('status').textContent = '';
    }
});

$('copy').addEventListener('click', () => {
    $('text').select();
    document.execCommand('copy');
});
$('download').addEventListener('click', () => {
    const blob = new Blob([$('text').value], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ($('vid').textContent || 'transcript') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
});
</script>
<script src="config.js"></script>
</body>
</html>
