<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Transcriber</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161a22;
            --panel-2: #1e2330;
            --border: #2a3142;
            --fg: #e6e8ec;
            --muted: #8b94a7;
            --accent: #ff5252;
            --accent-2: #ff7676;
            --ok: #7cf0a0;
            --warn: #f0bd7c;
            --err: #f5b3b3;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .sub { color: var(--muted); margin-bottom: 28px; }
        form, .card { background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; }
        .card + .card, form + .card, .card + form { margin-top: 16px; }
        label { display: block; font-size: 13px; color: var(--muted);
            margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; background: var(--panel-2);
            color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px;
        }
        textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            min-height: 320px; resize: vertical; line-height: 1.5; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-top: 14px; }
        .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center;
            flex-wrap: wrap; }
        button { background: var(--accent); color: white; border: 0;
            padding: 10px 18px; border-radius: 8px; font-weight: 600;
            cursor: pointer; font-size: 14px; }
        button.ghost { background: transparent; color: var(--fg);
            border: 1px solid var(--border); }
        button:hover { background: var(--accent-2); }
        button.ghost:hover { background: var(--panel-2); }
        button:disabled { background: #444; cursor: not-allowed; }
        .status { color: var(--muted); font-size: 13px; }
        .result { margin-top: 24px; }
        .meta { display: flex; gap: 16px; color: var(--muted);
            font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
        .meta span b { color: var(--fg); font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; }
        .badge.captions { background: #1f3a2a; color: var(--ok); }
        .badge.whisper  { background: #3a2a1f; color: var(--warn); }
        .error { background: #3a1f1f; border: 1px solid #5a2a2a; color: var(--err);
            padding: 12px 14px; border-radius: 8px; margin-top: 18px; }
        .banner { display: flex; gap: 10px; align-items: center;
            font-size: 13px; color: var(--muted); margin-bottom: 12px;
            flex-wrap: wrap; }
        .banner .dot { width: 8px; height: 8px; border-radius: 50%;
            background: var(--muted); }
        .banner .dot.ok { background: var(--ok); }
        .banner .dot.err { background: var(--err); }
        .banner .spacer { flex: 1; }
        details { margin-top: 14px; }
        summary { cursor: pointer; color: var(--muted); font-size: 13px; }
        a { color: var(--accent-2); }
        code { background: var(--panel-2); padding: 1px 6px; border-radius: 4px;
            font-size: 12px; }
        .locked { opacity: 0.5; pointer-events: none; }
    </style>
    <script src="config.js"></script>
</head>
<body>
<div class="wrap">
    <h1>YouTube Transcriber</h1>
    <p class="sub">
        Static frontend hosted on GitHub Pages. Point it at a backend running
        the Flask API to transcribe videos (captions first, Whisper fallback).
    </p>

    <div class="banner">
        <span class="dot" id="apiDot"></span>
        <span>Backend: <code id="apiCurrent">—</code></span>
        <span class="spacer"></span>
        <button type="button" class="ghost" id="apiEdit">Change</button>
    </div>

    <div class="card" id="apiCard" hidden>
        <label for="apiUrl">Backend base URL</label>
        <input id="apiUrl" type="url" placeholder="https://your-backend.fly.dev">
        <div class="actions">
            <button type="button" id="apiSave">Save</button>
            <button type="button" class="ghost" id="apiTest">Test connection</button>
            <span class="status" id="apiStatus"></span>
        </div>
    </div>

    <div class="banner" id="authBanner">
        <span class="dot" id="authDot"></span>
        <span id="authText">Checking authentication…</span>
        <span class="spacer"></span>
        <button type="button" id="loginBtn" hidden>Login with GitHub</button>
        <button type="button" class="ghost" id="logoutBtn" hidden>Logout</button>
    </div>

    <form id="form">
        <label for="url">Video URL or ID</label>
        <input id="url" name="url" type="text"
               placeholder="https://www.youtube.com/watch?v=..." required>

        <details>
            <summary>Advanced options</summary>
            <div class="row">
                <div>
                    <label for="languages">Preferred caption languages</label>
                    <input id="languages" name="languages" type="text"
                           value="en,de" placeholder="en,de">
                </div>
                <div>
                    <label for="whisper_model">Whisper model (fallback)</label>
                    <select id="whisper_model" name="whisper_model">
                        <option value="tiny">tiny</option>
                        <option value="base" selected>base</option>
                        <option value="small">small</option>
                        <option value="medium">medium</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <label>
                    <input type="checkbox" id="allow_whisper" checked>
                    Allow Whisper fallback
                </label>
            </div>
        </details>

        <div class="actions">
            <button id="go" type="submit">Transcribe</button>
            <span class="status" id="status"></span>
        </div>
    </form>

    <div id="error" class="error" hidden></div>

    <div class="result" id="result" hidden>
        <div class="meta">
            <span>Source: <b id="src"></b> <span id="srcBadge" class="badge"></span></span>
            <span>Language: <b id="lang"></b></span>
            <span>Video: <b id="vid"></b></span>
        </div>
        <label for="text">Transcript</label>
        <textarea id="text" readonly></textarea>
        <div class="actions">
            <button id="copy" type="button">Copy</button>
            <button id="download" type="button" class="ghost">Download .txt</button>
        </div>
    </div>
</div>

<script>
const API_KEY = 'ytt.apiBase';
const TOK_KEY = 'ytt.token';
const $ = (id) => document.getElementById(id);

// ---------- backend URL ----------
function getApiBase() {
    const fromQuery = new URLSearchParams(location.search).get('api');
    if (fromQuery) {
        localStorage.setItem(API_KEY, fromQuery);
        return fromQuery;
    }
    return localStorage.getItem(API_KEY) || window.YTT_API_BASE || '';
}
function setApiBase(v) {
    if (v) { localStorage.setItem(API_KEY, v); }
    else   { localStorage.removeItem(API_KEY); }
    renderApiBanner();
    refreshAuth();
}
function renderApiBanner() {
    const base = getApiBase();
    $('apiCurrent').textContent = base || '(not configured)';
    $('apiUrl').value = base || '';
    $('apiDot').className = 'dot' + (base ? '' : ' err');
}

// ---------- auth token ----------
function getToken() { return localStorage.getItem(TOK_KEY) || ''; }
function setToken(t) {
    if (t) { localStorage.setItem(TOK_KEY, t); }
    else   { localStorage.removeItem(TOK_KEY); }
}
function authHeaders() {
    const t = getToken();
    return t ? {'Authorization': 'Bearer ' + t} : {};
}

// On load, see if we just got redirected back from OAuth with #token=... or #error=...
function consumeHash() {
    if (!location.hash) return;
    const params = new URLSearchParams(location.hash.slice(1));
    const tok = params.get('token');
    const err = params.get('error');
    if (tok) {
        setToken(tok);
    }
    if (err) {
        showError('Login failed: ' + err);
    }
    if (tok || err) {
        history.replaceState(null, '', location.pathname + location.search);
    }
}

async function refreshAuth() {
    const base = getApiBase();
    if (!base) {
        renderAuth({state: 'no-backend'});
        return;
    }
    try {
        const res = await fetch(base + '/auth/me', {headers: authHeaders()});
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data.auth_required) {
            renderAuth({state: 'open'});
        } else if (data.authenticated) {
            renderAuth({state: 'in', user: data.user});
        } else {
            renderAuth({state: 'out'});
        }
    } catch (err) {
        renderAuth({state: 'unreachable', message: err.message});
    }
}

function renderAuth(s) {
    const dot = $('authDot');
    const text = $('authText');
    const loginBtn = $('loginBtn');
    const logoutBtn = $('logoutBtn');
    const form = $('form');
    loginBtn.hidden = true;
    logoutBtn.hidden = true;
    form.classList.remove('locked');

    if (s.state === 'no-backend') {
        dot.className = 'dot err';
        text.textContent = 'No backend configured.';
        form.classList.add('locked');
    } else if (s.state === 'unreachable') {
        dot.className = 'dot err';
        text.textContent = 'Backend unreachable: ' + (s.message || '');
        form.classList.add('locked');
    } else if (s.state === 'open') {
        dot.className = 'dot ok';
        text.textContent = 'Auth disabled on backend.';
    } else if (s.state === 'in') {
        dot.className = 'dot ok';
        text.textContent = 'Signed in as ' + s.user;
        logoutBtn.hidden = false;
    } else {
        dot.className = 'dot err';
        text.textContent = 'Not signed in.';
        loginBtn.hidden = false;
        form.classList.add('locked');
    }
}

function showError(msg) {
    $('error').textContent = msg;
    $('error').hidden = false;
}

// ---------- wiring ----------
$('apiEdit').addEventListener('click', () => { $('apiCard').hidden = !$('apiCard').hidden; });
$('apiSave').addEventListener('click', () => {
    setApiBase($('apiUrl').value.trim().replace(/\/+$/, ''));
    $('apiStatus').textContent = 'Saved.';
    setTimeout(() => $('apiStatus').textContent = '', 1500);
});
$('apiTest').addEventListener('click', async () => {
    const base = $('apiUrl').value.trim().replace(/\/+$/, '');
    if (!base) { $('apiStatus').textContent = 'Enter a URL first.'; return; }
    $('apiStatus').textContent = 'Testing…';
    try {
        const res = await fetch(base + '/api/health');
        $('apiStatus').textContent = res.ok ? '✓ reachable' : `✗ HTTP ${res.status}`;
    } catch (err) {
        $('apiStatus').textContent = '✗ ' + err.message;
    }
});

$('loginBtn').addEventListener('click', () => {
    const base = getApiBase();
    if (!base) { showError('Configure backend URL first.'); return; }
    window.location.href = base + '/auth/login';
});
$('logoutBtn').addEventListener('click', async () => {
    const base = getApiBase();
    if (base) {
        try { await fetch(base + '/auth/logout', {method: 'POST', headers: authHeaders()}); }
        catch {}
    }
    setToken('');
    refreshAuth();
});

$('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('error').hidden = true;
    $('result').hidden = true;
    const base = getApiBase();
    if (!base) { showError('No backend configured.'); return; }
    $('go').disabled = true;
    $('status').textContent = 'Working… (Whisper fallback can take a minute)';

    const payload = {
        url: $('url').value,
        languages: $('languages').value,
        whisper_model: $('whisper_model').value,
        allow_whisper: $('allow_whisper').checked,
    };

    try {
        const res = await fetch(base + '/api/transcribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', ...authHeaders()},
            body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) {
            setToken('');
            refreshAuth();
            showError('Session expired — please sign in again.');
            return;
        }
        if (!res.ok) {
            showError(data.error || `Request failed (HTTP ${res.status}).`);
            return;
        }
        $('src').textContent = data.source;
        $('srcBadge').textContent = data.source;
        $('srcBadge').className = 'badge ' + data.source;
        $('lang').textContent = data.language || '—';
        $('vid').textContent = data.video_id;
        $('text').value = data.text;
        $('result').hidden = false;
    } catch (err) {
        showError('Network error: ' + err.message);
    } finally {
        $('go').disabled = false;
        $('status').textContent = '';
    }
});

$('copy').addEventListener('click', () => {
    $('text').select();
    document.execCommand('copy');
});
$('download').addEventListener('click', () => {
    const blob = new Blob([$('text').value], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ($('vid').textContent || 'transcript') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
});

// ---------- boot ----------
consumeHash();
renderApiBanner();
refreshAuth();
</script>
</body>
</html>
