<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Transcriber</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #161a22;
            --panel-2: #1e2330;
            --border: #2a3142;
            --fg: #e6e8ec;
            --muted: #8b94a7;
            --accent: #ff5252;
            --accent-2: #ff7676;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px 80px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .sub { color: var(--muted); margin-bottom: 28px; }
        form { background: var(--panel); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; }
        label { display: block; font-size: 13px; color: var(--muted);
            margin-bottom: 6px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; background: var(--panel-2);
            color: var(--fg); border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px;
        }
        textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            min-height: 320px; resize: vertical; line-height: 1.5; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-top: 14px; }
        .actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
        button { background: var(--accent); color: white; border: 0;
            padding: 10px 18px; border-radius: 8px; font-weight: 600;
            cursor: pointer; font-size: 14px; }
        button:hover { background: var(--accent-2); }
        button:disabled { background: #444; cursor: not-allowed; }
        .status { color: var(--muted); font-size: 13px; }
        .result { margin-top: 24px; }
        .meta { display: flex; gap: 16px; color: var(--muted);
            font-size: 13px; margin-bottom: 8px; }
        .meta span b { color: var(--fg); font-weight: 600; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
            font-size: 11px; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.5px; }
        .badge.captions { background: #1f3a2a; color: #7cf0a0; }
        .badge.whisper  { background: #3a2a1f; color: #f0bd7c; }
        .error { background: #3a1f1f; border: 1px solid #5a2a2a; color: #f5b3b3;
            padding: 12px 14px; border-radius: 8px; margin-top: 18px; }
        details { margin-top: 14px; }
        summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
<div class="wrap">
    <h1>YouTube Transcriber</h1>
    <p class="sub">Tries YouTube captions first, falls back to Whisper if none are available.</p>

    <form id="form">
        <label for="url">Video URL or ID</label>
        <input id="url" name="url" type="text"
               placeholder="https://www.youtube.com/watch?v=..." required>

        <details>
            <summary>Advanced options</summary>
            <div class="row">
                <div>
                    <label for="languages">Preferred caption languages</label>
                    <input id="languages" name="languages" type="text"
                           value="en,de" placeholder="en,de">
                </div>
                <div>
                    <label for="whisper_model">Whisper model (fallback)</label>
                    <select id="whisper_model" name="whisper_model">
                        <option value="tiny">tiny</option>
                        <option value="base" selected>base</option>
                        <option value="small">small</option>
                        <option value="medium">medium</option>
                    </select>
                </div>
            </div>
            <div style="margin-top: 12px;">
                <label>
                    <input type="checkbox" id="allow_whisper" checked>
                    Allow Whisper fallback
                </label>
            </div>
        </details>

        <div class="actions">
            <button id="go" type="submit">Transcribe</button>
            <span class="status" id="status"></span>
        </div>
    </form>

    <div id="error" class="error" hidden></div>

    <div class="result" id="result" hidden>
        <div class="meta">
            <span>Source: <b id="src"></b> <span id="srcBadge" class="badge"></span></span>
            <span>Language: <b id="lang"></b></span>
            <span>Video: <b id="vid"></b></span>
        </div>
        <label for="text">Transcript</label>
        <textarea id="text" readonly></textarea>
        <div class="actions">
            <button id="copy" type="button">Copy</button>
            <button id="download" type="button">Download .txt</button>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('form');
const status = document.getElementById('status');
const errorBox = document.getElementById('error');
const result = document.getElementById('result');
const text = document.getElementById('text');
const src = document.getElementById('src');
const srcBadge = document.getElementById('srcBadge');
const lang = document.getElementById('lang');
const vid = document.getElementById('vid');
const goBtn = document.getElementById('go');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.hidden = true;
    result.hidden = true;
    goBtn.disabled = true;
    status.textContent = 'Working… (Whisper fallback can take a minute)';

    const payload = {
        url: document.getElementById('url').value,
        languages: document.getElementById('languages').value,
        whisper_model: document.getElementById('whisper_model').value,
        allow_whisper: document.getElementById('allow_whisper').checked,
    };

    try {
        const res = await fetch('/api/transcribe', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
            errorBox.textContent = data.error || 'Request failed.';
            errorBox.hidden = false;
            return;
        }
        src.textContent = data.source;
        srcBadge.textContent = data.source;
        srcBadge.className = 'badge ' + data.source;
        lang.textContent = data.language || '—';
        vid.textContent = data.video_id;
        text.value = data.text;
        result.hidden = false;
    } catch (err) {
        errorBox.textContent = 'Network error: ' + err.message;
        errorBox.hidden = false;
    } finally {
        goBtn.disabled = false;
        status.textContent = '';
    }
});

document.getElementById('copy').addEventListener('click', () => {
    text.select();
    document.execCommand('copy');
});
document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([text.value], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (vid.textContent || 'transcript') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
